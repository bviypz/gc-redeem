name: Create release

# Pushing a tag like v1.2.3 automatically creates a GitHub Release and
# attaches the userscript + metadata file. Tampermonkey polls
# https://github.com/<owner>/<repo>/releases/latest/download/gc-redeem.meta.js
# for a new @version and offers the update to users.
on:
  push:
    tags:
      - "v*"

jobs:
  make-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata block (gc-redeem.meta.js)
        run: awk '/==UserScript==/,/==\/UserScript==/' gc-redeem.user.js > gc-redeem.meta.js

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            gc-redeem.user.js gc-redeem.meta.js
